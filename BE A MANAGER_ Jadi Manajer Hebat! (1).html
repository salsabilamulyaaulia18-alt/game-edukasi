<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BE A MANAGER: Jadi Manajer Hebat!</title><style>
:root{--g:#174E3D;--gp:#DCE8C8;--k:#F8F3E8;--o:#F4A15D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--k);color:var(--g);font-family:"Trebuchet MS",system-ui,sans-serif}
.w{max-width:760px;margin:auto;padding:10px}
.btn{background:var(--o);color:#fff;border:0;border-radius:14px;padding:10px 18px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 0 #c97d3a;margin:4px}
.btn.g{background:var(--g);box-shadow:0 3px 0 #0c3326}.btn.s{padding:4px 11px;font-size:18px}
.btn:active{transform:translateY(2px)}
.scene{height:130px;border-radius:16px;overflow:hidden;position:relative;border:3px solid var(--g);background:linear-gradient(#a33 0 38%,transparent 38%),repeating-conic-gradient(#fff 0 25%,#cfd8c0 0 50%) 0 0/34px 34px;display:flex;align-items:flex-end;justify-content:space-around;font-size:40px;padding:0 8px 8px}
.scene span{animation:b 1.6s ease-in-out infinite}.scene span:nth-child(2n){animation-delay:.4s}.scene span:nth-child(3n){animation-delay:.8s}
.sign{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--k);color:var(--g);font-size:14px;font-weight:800;padding:2px 12px;border-radius:10px}
@keyframes b{50%{transform:translateY(-8px)}}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card{background:#fff;border:2px solid var(--gp);border-radius:14px;padding:10px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.e{font-size:34px}.sel{border-color:var(--o);background:#fff3e3}.done{opacity:.45}
.hd{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:12px;background:var(--gp);font-size:13px;font-weight:700}.chip.on{background:var(--g);color:#fff}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0;font-size:11px;text-align:center}
.bar{height:8px;background:#e5e0d2;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o);transition:width .5s}
.ins{background:var(--gp);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px}
.m{min-height:24px;font-weight:700;margin:6px 0}.ok{color:#1b7a3a}.no{color:#b3261e}
.q{background:#fff;border-radius:16px;padding:14px;border:2px solid var(--g)}
.op{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border-radius:12px;border:2px solid var(--gp);background:var(--k);color:var(--g);font-size:15px;cursor:pointer}
.op.c{background:#c9f0d3;border-color:#1b7a3a}.op.x{background:#ffd9d6;border-color:#b3261e}
.big{text-align:center}.big h1{font-size:clamp(34px,9vw,58px);margin:6px 0 0;letter-spacing:1px}.big h2{margin:0 0 8px;color:var(--o)}
#snd{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:9}
</style></head><body><button class="btn s g" id="snd" onclick="mus()">🔇</button><div class="w" id="a"></div><script>

const SK={sat:['😊','Kepuasan'],kin:['👥','Kinerja'],stok:['📦','Stok'],jual:['💰','Jual'],keu:['🏦','Uang']};

const ST3=[['Biarkan karyawan menyelesaikan sendiri',0,'Tanpa arahan, kerja jadi tidak terkoordinasi.'],['Koordinasikan: Andi membuat minuman, Sari di kasir, Budi mengantar pesanan',1,'Tepat! Arahan jelas mempercepat layanan.'],['Marahi karyawan agar lebih cepat',0,'Memarahi justru menurunkan motivasi.']];
const G=[
{p:0,t:'Siapkan Bahan Baku',k:'stok',sc:'🍓🥛🍬🧊🥤',ty:'pick',ins:'Kumpulkan bahan sesuai KEBUTUHAN 1 hari. Jangan beli bahan yang tidak perlu! Pakai tombol + dan −.',d:{i:[['🍓','Buah',3],['🥛','Susu',2],['🍬','Gula',1],['🧊','Es batu',2],['🥤','Gelas',4],['🍕','Pizza',0],['🧴','Sabun',0]]},
q:['Fresh Drink akan dibuka minggu depan. Manajer mencatat jenis dan jumlah bahan baku lebih dulu agar tidak kehabisan stok. Mengapa perencanaan ini penting?','Agar kegiatan usaha terarah dan sumber daya tersedia sesuai kebutuhan','Agar karyawan tidak perlu bekerja','Agar harga jual otomatis naik','Agar pelanggan tidak perlu memesan','Perencanaan menetapkan apa yang dibutuhkan sebelum usaha berjalan sehingga tidak boros dan tidak kekurangan.']},
{p:0,t:'Atur Modal Usaha',k:'keu',sc:'💵🧾🏦🧑‍💼',ty:'bud',ins:'Bagikan seluruh modal Rp2.000.000 sampai sisa tepat Rp0. Tiap pos punya batas minimum. Tekan + / − (kelipatan Rp100.000).',d:{i:[['🥭','Bahan baku',600],['🔧','Peralatan',400],['📣','Promosi',200],['⚙️','Operasional',300]]},
q:['Manajer membagi modal Rp2.000.000 ke bahan baku, peralatan, promosi, dan operasional sebelum usaha berjalan. Kegiatan ini termasuk fungsi ...','Planning','Organizing','Actuating','Controlling','Menyusun anggaran sebelum usaha berjalan adalah perencanaan (Planning).']},
{p:0,t:'Strategi Promosi',k:'jual',sc:'🏪📱🪧🏷️🧑‍🤝‍🧑',ty:'mul',ins:'Toko baru belum dikenal. Pilih 3 strategi promosi yang paling tepat lalu tekan Cek.',d:{n:3,o:[['📱','Promosi di media sosial',1],['🪧','Poster di sekitar kampus',1],['🏷️','Diskon pembukaan',1],['🤫','Tidak promosi, menunggu pelanggan datang',0],['🔇','Menaikkan harga tanpa alasan',0]]},
q:['Toko baru belum dikenal, sehingga manajer menentukan media dan bentuk promosi sebelum membuka toko. Mengapa perencanaan strategi pemasaran penting?','Agar tujuan penjualan dicapai dengan cara terarah dan sesuai anggaran','Agar karyawan bisa libur','Agar bahan baku tidak perlu dibeli','Agar laporan keuangan tidak perlu dibuat','Strategi yang direncanakan membuat promosi efektif dan efisien.']},
{p:1,t:'Atur Posisi Karyawan',k:'kin',sc:'🧑‍🍳👩‍💼🧑‍🦱🍹💳',ty:'asg',ins:'Ketuk karyawan, lalu ketuk posisi kerjanya. Sesuaikan dengan kemampuan masing-masing.',d:{p:P3,r:[['🍹','Pembuat minuman'],['💳','Kasir'],['🙋','Pelayan pelanggan']],c:[0,1,2]},
q:['Manajer menempatkan Andi sebagai pembuat minuman, Sari sebagai kasir, dan Budi sebagai pelayan sesuai kemampuan. Mengapa pembagian tugas diperlukan?','Agar setiap orang tahu tugasnya sehingga kerja efisien dan tidak tumpang tindih','Agar manajer tidak perlu mengawasi','Agar gaji semua karyawan sama','Agar toko tidak perlu perlengkapan','Pembagian tugas membuat pekerjaan jelas dan efisien.']},
{p:1,t:'Siapkan Perlengkapan',k:'stok',sc:'🌀🥤🖥️🛎️',ty:'grp',ins:'Ketuk perlengkapan, lalu ketuk kelompok yang sesuai: Produksi atau Pelayanan.',d:{g:['Produksi','Pelayanan'],o:[['🌀','Blender',0],['🥤','Gelas',0],['🥄','Sendok takar',0],['🧺','Wadah bahan baku',0],['🖥️','Mesin kasir',1],['🛎️','Meja pelayanan',1]]},
q:['Manajer mengelompokkan blender, gelas, dan sendok takar untuk produksi, serta mesin kasir untuk pelayanan. Mengatur sumber daya seperti ini termasuk fungsi ...','Organizing','Planning','Actuating','Controlling','Organizing mengatur sumber daya (orang, alat, tugas) agar siap dipakai.']},
{p:1,t:'Tanggung Jawab Tim',k:'kin',sc:'📦🙋💳🧑‍🍳',ty:'asg',ins:'Karyawan belum paham tugasnya. Tentukan siapa yang mengelola stok, melayani pelanggan, dan mengelola pembayaran. Tidak boleh ada tugas yang kosong.',d:{p:[['🧑‍🍳','Andi','Rajin & teliti mencatat stok'],['🧑‍🦱','Budi','Ramah & komunikatif'],['👩‍💼','Sari','Jujur & teliti hitung uang']],r:[['📦','Mengelola persediaan'],['🙋','Melayani pelanggan'],['💳','Mengelola pembayaran']],c:[0,1,2]},
q:['Setiap karyawan diberi wewenang dan tanggung jawab yang jelas: stok, pelayanan, dan pembayaran. Manfaat utamanya adalah ...','Tidak ada pekerjaan terbengkalai dan tiap orang bisa dimintai pertanggungjawaban','Karyawan boleh memilih tugas sesukanya','Manajer tidak lagi bertanggung jawab','Semua orang mengerjakan semua hal','Wewenang dan tanggung jawab yang jelas membuat kerja tim tertib.']},
{p:2,t:'Buat Pesanan Minuman',k:'sat',sc:'🥤🍓🍧🧊🍹',ty:'ord',ins:'Pelanggan memesan Es Buah Segar. Ketuk langkah pembuatan sesuai URUTAN yang benar.',d:{n:'Es Buah Segar',s:['Pilih gelas besar','Masukkan potongan buah','Tambahkan sirup & susu','Tambahkan es batu','Aduk & beri topping'],cup:['🥛','🍓','🍧','🧊','🍹'],c:['Pesanan: Es Buah Segar']},
q:['Manajer mengarahkan karyawan mengikuti prosedur pembuatan minuman agar rasa dan tampilan sesuai standar. Kegiatan tersebut termasuk fungsi ...','Actuating','Planning','Organizing','Controlling','Actuating adalah mengarahkan dan menggerakkan karyawan menjalankan pekerjaan.']},
{p:2,t:'Layani Pelanggan',k:'sat',sc:'🧓👦🛎️🧾🤝',ty:'ord',ins:'Layani 2 pelanggan. Ketuk langkah pelayanan sesuai urutan yang benar.',d:{n:'Pelayanan',s:['Sapa pelanggan','Terima pesanan','Catat pesanan','Cek kesesuaian pesanan','Serahkan minuman'],cup:['👋','🗣️','📝','✅','🤝'],c:['🧓 Bu Rina','👦 Dimas']},
q:['Manajer memandu karyawan menyapa, mencatat, dan menyerahkan pesanan dengan ramah agar pelanggan puas. Ini inti Actuating, yaitu ...','Membimbing dan menggerakkan karyawan melaksanakan pekerjaan','Menyusun rencana tahunan','Membuat struktur organisasi','Memeriksa laporan akhir bulan','Pengarahan memastikan pekerjaan dijalankan dengan baik sesuai rencana.']},
{p:2,t:'Toko Ramai!',k:'kin',sc:'😰🧑‍🍳🧑‍🦱👩‍💼🧍🧍‍♀️',ty:'scn',ins:'Toko sedang ramai dan karyawan kewalahan. Pilih tindakan terbaik di setiap situasi.',d:{s:[['Antrean memanjang dan karyawan kewalahan. Apa arahanmu?',ST3],['Karyawan mulai lelah dan kurang semangat.',[['Abaikan, yang penting terjual banyak',0,'Karyawan bisa makin lelah.'],['Beri semangat, apresiasi, dan istirahat singkat bergilir',1,'Tepat! Motivasi menjaga kinerja.'],['Tambah target tanpa bicara',0,'Tanpa komunikasi, tekanan bertambah.']]],['Ada pelanggan menunggu cukup lama.',[['Minta maaf, jelaskan estimasi, dan minta tim saling bantu',1,'Tepat! Komunikasi dan kerja sama.'],['Diamkan saja',0,'Pelanggan bisa kecewa.'],['Suruh pelanggan pergi',0,'Merusak kepuasan pelanggan.']]]]},
q:['Saat toko ramai, manajer memberi semangat, instruksi yang jelas, dan mengoordinasikan karyawan. Kemampuan apa yang diterapkan dalam Actuating?','Motivasi, komunikasi, dan koordinasi','Menyusun anggaran','Menghitung selisih penjualan','Membuat struktur jabatan','Actuating menekankan motivasi, komunikasi, dan koordinasi.']},
{p:3,t:'Laporan Penjualan',k:'jual',sc:'📊📉🧾🧑‍💼',ty:'mul',ins:'Periksa laporan. Pilih 3 temuan dan tindakan yang tepat, lalu tekan Cek.',d:{n:3,i:'<div class="card"><b>Target 100 gelas</b><div class="bar"><i style="width:100%"></i></div><b>Aktual 75 gelas</b><div class="bar"><i style="width:75%"></i></div></div>',o:[['📉','Selisih penjualan 25 gelas (tercapai 75%)',1],['🔎','Cari penyebab target tidak tercapai',1],['📣','Tambah promosi dan evaluasi strategi jual',1],['🎉','Anggap target sudah tercapai',0],['🙈','Abaikan laporan ini',0]]},
q:['Target penjualan 100 gelas, tetapi terjual 75 gelas. Manajer membandingkan keduanya, mencari penyebab, lalu memperbaiki strategi. Aktivitas ini fungsi ...','Controlling','Planning','Organizing','Actuating','Controlling = membandingkan hasil dengan rencana lalu mengambil tindakan perbaikan.']},
{p:3,t:'Pengeluaran Usaha',k:'keu',sc:'🧾💸🧮🧑‍💼',ty:'mul',ins:'Bandingkan anggaran dan realisasi. Pilih 3 temuan/tindakan yang tepat, lalu tekan Cek.',d:{n:3,i:'<div class="card" style="text-align:left">🥭 Bahan: anggaran 600rb, realisasi 580rb<br>📣 Promosi: anggaran 200rb, realisasi <b style="color:#b3261e">350rb</b><br>⚙️ Operasional: anggaran 300rb, realisasi 310rb</div>',o:[['📣','Promosi melebihi anggaran Rp150.000',1],['🔎','Periksa kemungkinan pemborosan promosi',1],['✂️','Batasi pengeluaran promosi berikutnya',1],['🥭','Bahan baku hemat Rp20.000 (aman, bukan masalah)',0],['🧾','Hapus catatan pengeluaran',0]]},
q:['Pengeluaran promosi melebihi anggaran. Langkah pengawasan yang paling tepat adalah ...','Membandingkan anggaran dengan realisasi, mencari penyebab, lalu mengoreksi','Membiarkannya karena sudah terjadi','Menambah modal tanpa evaluasi','Memberhentikan semua karyawan','Pengawasan anggaran: bandingkan, temukan penyimpangan, lakukan koreksi.']},
{p:3,t:'Kualitas Minuman',k:'sat',sc:'😕🍹🔍🥄',ty:'scn',ins:'Pelanggan mengeluh rasa minuman tidak konsisten. Selidiki dan perbaiki.',d:{s:[['Apa yang pertama diperiksa?',[['Takaran bahan dan cara pembuatan',1,'Tepat! Periksa bahan dan proses.'],['Ganti semua karyawan',0,'Terlalu cepat menyimpulkan.'],['Naikkan harga',0,'Tidak menyelesaikan masalah.']]],['Ditemukan: gula ditakar "kira-kira". Apa penyebabnya?',[['Tidak ada takaran standar',1,'Benar, tidak ada standar.'],['Pelanggan salah rasa',0,'Menyalahkan pelanggan tidak tepat.'],['Esnya terlalu dingin',0,'Tidak berhubungan.']]],['Tindakan korektif apa yang dipilih?',[['Tetapkan takaran standar dan latih ulang karyawan',1,'Tepat! Koreksi menjaga kualitas.'],['Biarkan saja',0,'Masalah akan berulang.'],['Hentikan jualan',0,'Berlebihan.']]]]},
q:['Rasa minuman tidak konsisten; manajer memeriksa bahan dan proses lalu menetapkan takaran standar. Tindakan ini bertujuan ...','Memastikan hasil sesuai standar dan memperbaiki penyimpangan','Menyusun rencana promosi','Membagi tugas karyawan','Memberi semangat karyawan','Controlling memastikan pelaksanaan sesuai standar dan memperbaiki penyimpangan.']}];
let S,m,s,mist,au,ac,iv;
function mus(){const b=document.getElementById('snd');if(au){au=0;clearInterval(iv);b.textContent='🔇';return}au=1;b.textContent='🔊';ac=ac||new(window.AudioContext||window.webkitAudioContext)();const M=[784,0,659,784,880,784,659,0,698,0,587,698,784,698,587,0,659,659,784,880,1047,880,784,659,698,784,698,587,523,0,0,0],B=[131,131,175,175,131,196,175,196];let i=0;iv=setInterval(()=>{const k=i++%32,t=ac.currentTime;const nt=(f,ty,v,d)=>{if(!f)return;const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)};nt(M[k],'square',.03,.2);if(k%2==0)nt(B[k>>2],'triangle',.08,.3);if(k%4==0)nt(90,'sine',.12,.12);if(k%2==1)nt(5000,'square',.008,.03);if(k%8==4)nt(M[k]*2||1568,'triangle',.02,.15)},190)}
function menu(){A.innerHTML=`<div class="big"><div class="scene" style="height:170px;font-size:48px"><div class="sign">🍹 FRESH DRINK</div><span>🧑‍💼</span><span>🧑‍🍳</span><span>👩‍💼</span><span>🧑‍🦱</span><span>🧍‍♀️</span></div><h1>BE A MANAGER!</h1><h2>Jadi Manajer Hebat!</h2><p>Siap mengelola Fresh Drink dan menjadi manajer hebat?</p><button class="btn" onclick="start()">MULAI PERMAINAN</button><button class="btn g" onclick="how()">CARA BERMAIN</button></div>`}
function how(){A.innerHTML=`<div class="q"><h2>Cara Bermain</h2><p>Kamu adalah manajer Fresh Drink. Selesaikan <b>12 mini-game</b> dalam 4 tahap POAC: Planning, Organizing, Actuating, Controlling.</p><p>1️⃣ Baca instruksi, lalu lakukan aktivitas (ketuk, pilih, atur angka, susun urutan).<br>2️⃣ Selesaikan tantangan untuk mendapat poin dan ⭐.<br>3️⃣ Jawab 1 pertanyaan kuis, lalu baca penjelasannya.<br>4️⃣ Salah itu boleh: kamu bisa mencoba lagi, tetapi bintang berkurang.</p><p>Skor maksimal 120 poin. Jaga lima indikator usahamu tetap tinggi!</p><button class="btn" onclick="menu()">Kembali</button></div>`}
function start(){S={i:0,pts:0,st:0,ok:0,bad:0,mg:0,v:{sat:40,kin:40,stok:40,jual:40,keu:40}};play()}
function play(){m=G[S.i];mist=0;s={m:'',s:null};const d=m.d;
if(m.ty=='pick')s.c=d.i.map(_=>0);if(m.ty=='bud')s.c=d.i.map(x=>x[2]/100);if(m.ty=='mul')s.x=new Set();
if(m.ty=='asg')s.a=d.p.map(_=>-1);if(m.ty=='grp')s.a=d.o.map(_=>-1);
if(m.ty=='ord'){s.n=0;s.r=0;s.l=$$(d.s.map((_,i)=>i))}if(m.ty=='scn')s.g=0;draw()}
function frame(b){const v=S.v;return `<div class="hd"><div>${PH.map((x,i)=>`<span class="chip ${i==m.p?'on':''}">${PI[i]} ${x[0]}</span>`).join(' ')}</div><b>⭐ ${S.st} · 🏆 ${S.pts} · ${S.i+1}/12</b></div>
<div class="bars">${Object.keys(SK).map(k=>`<div>${SK[k][0]} ${SK[k][1]}<div class="bar"><i style="width:${v[k]}%"></i></div></div>`).join('')}</div>
<div class="scene"><div class="sign">🍹 FRESH DRINK</div>${[...m.sc.match(/\p{Extended_Pictographic}(\u200d\p{Extended_Pictographic})*\ufe0f?/gu)].map(x=>`<span>${x}</span>`).join('')}</div>
<h3 style="margin:8px 0 0">${PI[m.p]} ${PH[m.p]}: ${TH[m.p]}</h3><b>Mini-game ${S.i%3+1}: ${m.t}</b><div class="ins">👉 ${m.ins}</div>${b}<div class="m ${s.k||''}">${s.m}</div>`}
function say(t,k){s.m=t;s.k=k;draw()}
function draw(){const d=m.d,t=m.ty;let b='';
if(t=='pick'){b=`<div class="ins" style="background:#fff3e3">Kebutuhan: ${d.i.filter(x=>x[2]).map(x=>x[0]+' '+x[1]+' ×'+x[2]).join(' · ')}</div><div class="grid">${d.i.map((x,i)=>`<div class="card"><div class="e">${x[0]}</div><b>${x[1]}</b><div><button class="btn s" onclick="pk(${i},-1)">−</button> <b>${s.c[i]}</b> <button class="btn s" onclick="pk(${i},1)">+</button></div></div>`).join('')}</div><button class="btn g" onclick="chk()">Cek Persiapan</button>`}
if(t=='bud'){const u=s.c.reduce((a,b)=>a+b,0)*100;b=`<h3>Sisa modal: Rp${((2000-u)*1000).toLocaleString('id-ID')}</h3><div class="grid">${d.i.map((x,i)=>`<div class="card"><div class="e">${x[0]}</div><b>${x[1]}</b><br><small>min Rp${x[2]*1000}</small><div><button class="btn s" onclick="pk(${i},-1)">−</button> <b>${s.c[i]*100}rb</b> <button class="btn s" onclick="pk(${i},1)">+</button></div></div>`).join('')}</div><button class="btn g" onclick="chk()">Cek Anggaran</button>`}
if(t=='mul'){b=(d.i||'')+`<div class="grid">${d.o.map((x,i)=>`<div class="card ${s.x.has(i)?'sel':''}" onclick="tg(${i})" style="cursor:pointer"><div class="e">${x[0]}</div>${x[1]}</div>`).join('')}</div><button class="btn g" onclick="chk()">Cek (${s.x.size}/${d.n})</button>`}
if(t=='asg'){b=`<div class="grid">${d.p.map((x,i)=>`<div class="card ${s.s==i?'sel':''}" onclick="s.s=${i};draw()" style="cursor:pointer"><div class="e">${x[0]}</div><b>${x[1]}</b><br><small>${x[2]}</small><br>${s.a[i]>=0?'→ '+d.r[s.a[i]][0]+' '+d.r[s.a[i]][1]:'—'}</div>`).join('')}</div><div class="grid">${d.r.map((x,i)=>`<button class="btn" onclick="as(${i})">${x[0]} ${x[1]}</button>`).join('')}</div><button class="btn g" onclick="chk()">Cek Pembagian</button>`}
if(t=='grp'){b=`<div class="grid">${d.o.map((x,i)=>`<div class="card ${s.s==i?'sel':''} ${s.a[i]>=0?'done':''}" onclick="s.s=${i};draw()" style="cursor:pointer"><div class="e">${x[0]}</div>${x[1]}<br><small>${s.a[i]>=0?'→ '+d.g[s.a[i]]:''}</small></div>`).join('')}</div><div>${d.g.map((x,i)=>`<button class="btn" onclick="as(${i})">${i?'🛎️':'🍹'} ${x}</button>`).join('')}</div><button class="btn g" onclick="chk()">Cek Kelompok</button>`}
if(t=='ord'){const c=d.c[s.r];b=`<div class="card"><b>${c}</b><div class="e" style="min-height:44px;letter-spacing:6px">${d.cup.slice(0,s.n).join('')||'🫗'}</div>Langkah ${s.n}/${d.s.length}</div><div class="grid">${s.l.map(i=>`<button class="btn ${i<s.n?'g':''}" ${i<s.n?'disabled':''} onclick="od(${i})">${d.cup[i]} ${d.s[i]}</button>`).join('')}</div>`}
if(t=='scn'){const g=d.s[s.g];b=`<div class="card"><b>Situasi ${s.g+1}/3</b><br>${g[0]}</div>${g[1].map((o,i)=>`<button class="op" onclick="sc(${i})">${o[0]}</button>`).join('')}`}
A.innerHTML=frame(b)}
function pk(i,d){const x=m.d.i[i];if(m.ty=='bud'){if(s.c[i]+d<x[2]/100&&d<0)return say('Minimum pos ini Rp'+x[2]*1000,'no');const u=s.c.reduce((a,b)=>a+b,0);if(d>0&&u>=20)return say('Modal habis!','no')}s.c[i]=Math.max(0,Math.min(9,s.c[i]+d));s.m='';draw()}
function tg(i){s.x.has(i)?s.x.delete(i):s.x.add(i);s.m='';draw()}
function as(r){if(s.s==null)return say('Pilih dulu salah satu kartu di atas.','no');if(m.ty=='asg')s.a=s.a.map(a=>a==r?-1:a);s.a[s.s]=r;s.s=null;s.m='';draw()}
function bad(t){mist++;say('❌ '+t,'no')}
function chk(){const d=m.d,t=m.ty;
if(t=='pick'){const w=d.i.findIndex((x,i)=>s.c[i]!=x[2]);return w<0?fin():bad(d.i[w][2]?'Jumlah '+d.i[w][1]+' belum sesuai kebutuhan.':d.i[w][1]+' tidak diperlukan!')}
if(t=='bud'){const u=s.c.reduce((a,b)=>a+b,0);return u!=20?bad('Modal harus habis dibagi tepat (sisa belum Rp0).'):fin()}
if(t=='mul'){const ok=d.o.every((o,i)=>!!o[2]==s.x.has(i));return ok?fin():bad('Masih ada pilihan yang kurang tepat. Pikirkan lagi!')}
if(t=='asg'){if(s.a.includes(-1))return bad('Semua karyawan harus punya tugas.');return s.a.every((a,i)=>a==d.c[i])?fin():bad('Ada tugas yang belum cocok dengan kemampuan karyawan.')}
if(t=='grp'){if(s.a.includes(-1))return bad('Masih ada perlengkapan belum dikelompokkan.');return d.o.every((o,i)=>o[2]==s.a[i])?fin():bad('Ada perlengkapan di kelompok yang salah.')}}
function od(i){const d=m.d;if(i!=s.n){mist++;s.m='❌ Bukan langkah itu. Coba lagi!';s.k='no';A.innerHTML=frame('');A.firstChild.style.animation='sh .3s';return setTimeout(draw,350)}s.n++;s.m='✅ Bagus!';s.k='ok';if(s.n==d.s.length){if(s.r<d.c.length-1){s.r++;s.n=0;s.l=$$(d.s.map((_,i)=>i));s.m='😊 Pelanggan senang! Pelanggan berikutnya datang...'}else return fin()}draw()}
function sc(i){const g=m.d.s[s.g][1][i];if(!g[1]){mist++;return say('❌ '+g[2]+' Coba pilihan lain.','no')}s.g++;if(s.g==3)return fin();say('✅ '+g[2],'ok')}
function fin(){const r=mist==0?3:mist<=2?2:1,p=mist?3:5;S.pts+=p;S.st+=r;S.mg++;S.v[m.k]=Math.min(100,S.v[m.k]+(mist?8:15));
A.innerHTML=frame(`<div class="q big"><div class="e">🎉</div><h2>Tantangan Selesai!</h2><div style="font-size:34px">${'⭐'.repeat(r)}${'☆'.repeat(3-r)}</div><p>+${p} poin · ${mist?mist+' kesalahan, tetap hebat!':'Sempurna tanpa salah!'}</p><button class="btn" onclick="qz()">Lanjut ke Pertanyaan ▶</button></div>`)}
function qz(){const q=m.q,o=$$([1,2,3,4]);A.innerHTML=frame(`<div class="q"><b>❓ Pertanyaan ${S.i+1}/12</b><p>${q[0]}</p>${o.map((x,j)=>`<button class="op" id="o${x}" onclick="an(${x})">${'ABCD'[j]}. ${q[x]}</button>`).join('')}<div id="fb"></div></div>`)}
function an(x){const ok=x==1;document.querySelectorAll('.op').forEach(b=>b.disabled=true);document.getElementById('o1').classList.add('c');if(!ok)document.getElementById('o'+x).classList.add('x');ok?(S.pts+=5,S.ok++):S.bad++;if(ok)S.v.sat=Math.min(100,S.v.sat+3);
document.getElementById('fb').innerHTML=`<p class="${ok?'ok':'no'}"><b>${ok?'✅ Benar! +5 poin':'❌ Belum tepat.'}</b><br>${m.q[5]}</p><button class="btn" onclick="nx()">${S.i==11?'Lihat Hasil 🏁':'Lanjut ▶'}</button>`}
function nx(){S.i++;S.i==12?end():play()}
function end(){const p=S.pts,t=p>=100?'Manajer Hebat 🏆':p>=80?'Manajer Profesional 🥇':p>=60?'Manajer Berkembang 🥈':'Calon Manajer Hebat 🌱';
A.innerHTML=`<div class="big"><div class="scene" style="height:150px;font-size:44px"><div class="sign">🍹 FRESH DRINK · SUKSES!</div><span>🧑‍💼</span><span>🧑‍🍳</span><span>👩‍💼</span><span>🧑‍🦱</span><span>🥳</span></div><h1 style="font-size:34px">Selamat, Manajer!</h1><h2>${t}</h2>
<div class="q" style="text-align:left"><b>🏆 Total poin: ${p}/120</b> · ⭐ ${S.st}/36<br>🎮 Mini-game selesai: ${S.mg}/12<br>✅ Benar: ${S.ok} · ❌ Salah: ${S.bad}
<div class="bars" style="margin-top:10px">${Object.keys(SK).map(k=>`<div>${SK[k][0]} ${SK[k][1]}<div class="bar"><i style="width:${S.v[k]}%"></i></div>${S.v[k]}%</div>`).join('')}</div></div>
<div class="q" style="text-align:left;margin-top:8px"><b>📘 Kesimpulan</b><br>📋 <b>Planning</b>: merencanakan bahan, modal, dan promosi sebelum usaha berjalan.<br>🧩 <b>Organizing</b>: membagi tugas, wewenang, dan mengatur sumber daya.<br>🚀 <b>Actuating</b>: mengarahkan, memotivasi, dan mengoordinasikan karyawan.<br>🔍 <b>Controlling</b>: membandingkan hasil dengan rencana, lalu memperbaiki penyimpangan.</div>
<button class="btn" onclick="start()">Main Lagi</button><button class="btn g" onclick="menu()">Kembali ke Menu Utama</button></div>`}
menu();
</script></body></html>
